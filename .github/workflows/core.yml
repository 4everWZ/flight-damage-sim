name: Core experiments
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Incremental configuration switches through real core ABI
        run: python3 tests/build_config_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-config-evidence
          path: results/build-config-summary.json
          if-no-files-found: error
  moving-aim:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Actual flight tracking, input cadence and feedforward ablation
        run: python3 tools/aim_tracking_experiments.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aim-tracking-evidence
          path: |
            results/aim-tracking-summary.json
            results/mouse_circle_aim_validation-material_feedback.csv
            results/mouse_circle_aim_validation-material_continuous.csv
            results/mouse_circle_aim_validation-material_sample30.csv
          if-no-files-found: error
  lifting-line-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independent low-angle lifting-line reference
        run: python3 tools/lifting_line_reference.py
      - name: Explicit sectional fixture and conservative cell transfer
        run: python3 tools/section_transfer_reference.py
      - name: Local sectional loss and self-consistent wake coupling
        run: python3 tools/local_section_coupling.py
      - name: Static roll authority through actual control chains
        run: python3 tools/roll_authority_reference.py
      - name: Actual disconnect and captured-angle jam comparison
        run: python3 tools/control_fault_reference.py
      - name: Fault transition continuity and actuator-time refinement
        run: python3 tools/control_transition_reference.py
      - uses: actions/upload-artifact@v4
        with:
          name: lifting-line-reference-evidence
          path: |
            results/lifting-line-summary.json
            results/lifting-line-loads.csv
            results/section-transfer-summary.json
            results/section-transfer-strips.csv
            results/local-section-summary.json
            results/local-section-loads.csv
            results/roll-authority-summary.json
            results/roll-authority.csv
            results/control-fault-summary.json
            results/control-fault-curves.csv
            results/control-transition-summary.json
            results/control-transition-hardware.csv
            results/control-transition-forces.csv
          if-no-files-found: error
  physics-and-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and review mechanics
        run: make -j2 test
      - name: Reproduce core and Instructor experiments
        run: |
          python3 tools/experiments.py
          python3 tools/instructor_experiments.py
          python3 tools/propulsion_experiments.py
          python3 tools/rotor_experiments.py
          python3 tools/detachment_experiments.py
          python3 tools/material_experiments.py
          python3 tools/control_experiments.py
          python3 tools/sensor_history_experiments.py
          python3 tools/load_sample_experiments.py
          python3 tools/clock_experiments.py
          python3 tools/finite_span_experiments.py
      - name: Exercise live input and render transport
        run: |
          python3 -m pip install -r requirements-viewer.txt
          python3 tests/live_client_tests.py
          python3 tests/detached_live_tests.py
          python3 tests/material_live_tests.py
          python3 tools/viewer.py --smoke
          python3 tools/plot_results.py
      - name: Preserve viewer slice evidence
        uses: actions/upload-artifact@v4
        with:
          name: viewer-slice-evidence
          path: |
            results/viewer-smoke.png
            results/viewer-input-summary.json
          if-no-files-found: error
      - name: Preserve detached-body experiment
        uses: actions/upload-artifact@v4
        with:
          name: detachment-evidence
          path: |
            results/detachment-summary.json
            results/detached-flight.csv
            results/detached-flight.png
          if-no-files-found: error
      - name: Preserve material mass experiment
        uses: actions/upload-artifact@v4
        with:
          name: material-evidence
          path: results/material-summary.json
          if-no-files-found: error
      - name: Preserve controller experiment
        uses: actions/upload-artifact@v4
        with:
          name: control-evidence
          path: |
            results/control-summary.json
            results/lagged-control-summary.json
            results/control-sensitivity.csv
            results/sensitivity-isolation.txt
            results/sensor-history-summary.json
            results/sensor-history-replay.txt
            results/sensor-history-release.csv
            results/sensor-history-120-*.txt
            results/sensor-history-960-*.txt
            results/load-sample-summary.json
            results/load-sample-cases.txt
            results/load-sample-trace.csv
          if-no-files-found: error
      - name: Preserve final clock decomposition
        uses: actions/upload-artifact@v4
        with:
          name: clock-evidence
          path: |
            results/clock-summary.json
            results/clock-cases.txt
            results/clock-trace.csv
            results/clock-age-reference.csv
          if-no-files-found: error
      - name: Preserve finite-span capability evidence
        uses: actions/upload-artifact@v4
        with:
          name: finite-span-evidence
          path: |
            results/finite-span.csv
            results/finite-span-summary.json
          if-no-files-found: error
