name: Core experiments
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  physics-and-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and review mechanics
        run: make -j2 test
      - name: Reproduce core and Instructor experiments
        run: |
          python3 tools/experiments.py
          python3 tools/instructor_experiments.py
          python3 tools/propulsion_experiments.py
          python3 tools/rotor_experiments.py
          python3 tools/detachment_experiments.py
          python3 tools/material_experiments.py
          python3 tools/control_experiments.py
      - name: Exercise live input and render transport
        run: |
          python3 -m pip install -r requirements-viewer.txt
          python3 tests/live_client_tests.py
          python3 tests/detached_live_tests.py
          python3 tests/material_live_tests.py
          python3 tools/viewer.py --smoke
          python3 tools/plot_results.py
      - name: Preserve viewer slice evidence
        uses: actions/upload-artifact@v4
        with:
          name: viewer-slice-evidence
          path: |
            results/viewer-smoke.png
            results/viewer-input-summary.json
          if-no-files-found: error
      - name: Preserve detached-body experiment
        uses: actions/upload-artifact@v4
        with:
          name: detachment-evidence
          path: |
            results/detachment-summary.json
            results/detached-flight.csv
            results/detached-flight.png
          if-no-files-found: error
      - name: Preserve material mass experiment
        uses: actions/upload-artifact@v4
        with:
          name: material-evidence
          path: results/material-summary.json
          if-no-files-found: error
      - name: Preserve controller experiment
        uses: actions/upload-artifact@v4
        with:
          name: control-evidence
          path: |
            results/control-summary.json
            results/control-sensitivity.csv
            results/sensitivity-isolation.txt
          if-no-files-found: error
