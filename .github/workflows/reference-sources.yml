name: Reference source extraction
on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/extract_spitfire_sources.py
      - tools/extract_control_sources.py
      - tools/spitfire_reference_summary.py
      - data/spitfire-va-naca-reference.json
      - .github/workflows/reference-sources.yml
permissions:
  contents: read
jobs:
  reference-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Convert the separate proposal without simulator imports
        run: python3 tools/spitfire_reference_summary.py
      - name: Isolated public NACA report extraction and scan cross-reading
        run: |
          python3 -m venv build/reference-venv
          build/reference-venv/bin/python -m pip install pypdf==6.0.0 pymupdf==1.26.6
          build/reference-venv/bin/python tools/extract_spitfire_sources.py --ocr-review
      - name: Read fixed official control-surface reports and original scan figures
        run: build/reference-venv/bin/python tools/extract_control_sources.py --log-review-images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spitfire-source-reports
          path: results/spitfire-source/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-source-reports
          path: results/control-source/
          if-no-files-found: error
